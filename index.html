<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AKALKA Doors & Panels — precision-manufactured doors, sandwich panels, cleanroom panels, partition systems, profiles & accessories." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AKALKA — Doors & Panels | Precision Manufacturing" />
    <meta property="og:description" content="Doors, sandwich panels, cleanroom panels, partition systems and the profiles that join them — one coordinated manufacturing system." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="AKALKA — Doors & Panels" />
    <meta name="twitter:description" content="Precision-manufactured doors, panels and profiles. Everything listed is confirmed data." />
    <meta name="theme-color" content="#2B3036" />
    <title>AKALKA — Doors & Panels | Precision Manufacturing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://images.pexels.com" />
    <script>
      /* First visit of a session: the boot overture runs, and the page holds
         its entrance animations until the doors part (see Boot.jsx / index.css).
         The class is cleared by Boot; this timer is the failsafe. */
      (function () {
        try {
          if (matchMedia("(prefers-reduced-motion: reduce)").matches || sessionStorage.getItem("akalka-booted")) return;
          var h = document.documentElement;
          h.classList.add("booting");
          setTimeout(function () {
            h.classList.remove("booting");
            window.dispatchEvent(new Event("akalka:booted"));
          }, 7000);
        } catch (e) {}
      })();
    </script>
    <script>
      /* Home opens on the hero photograph: start it at the same time as the
         app bundle, on the home route only. */
      (function () {
        var base = "%FAVICON_BASE%", p = location.pathname;
        if (p !== base && p + "/" !== base && p !== base + "index.html") return;
        var l = document.createElement("link"), w = [1280, 1920, 2560, 3200];
        l.rel = "preload"; l.as = "image"; l.type = "image/webp"; l.fetchPriority = "high";
        l.href = base + "Images/hero-cleanroom-1920.webp";
        l.imageSrcset = w.map(function (x) { return base + "Images/hero-cleanroom-" + x + ".webp " + x + "w"; }).join(", ");
        l.imageSizes = "(max-aspect-ratio: 3/2) 156svh, 104vw";
        document.head.appendChild(l);
      })();
    </script>
    <!-- Font stylesheet loads without blocking first paint (the boot screen is
         inline and paints at once); display=swap shows text immediately. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=DM+Sans:opsz,wght@9..40,100..1000&family=Nunito:wght@200..1000&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=DM+Sans:opsz,wght@9..40,100..1000&family=Nunito:wght@200..1000&display=swap" rel="stylesheet" /></noscript>
    <link rel="icon" type="image/svg+xml" href="%FAVICON_BASE%Akalka-logo.svg" />
    <style>
      /* Instant branded loader: the worksurface and a quiet track with a sweeping
         lime segment, painted before any script runs. Boot.jsx takes over from it. */
      #boot-shell { position: fixed; inset: 0; background: #2B3036; }
      #boot-shell .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,0.14); overflow: hidden; }
      #boot-shell .bar i { display: block; height: 100%; width: 36%; background: #7DB200; animation: scan 1.3s ease-in-out infinite; }
      @keyframes scan { 0% { transform: translateX(-110%); } 100% { transform: translateX(300%); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-shell">
        <div class="bar" aria-hidden="true"><i></i></div>
        <noscript><p style="position:absolute;inset:0;display:grid;place-items:center;margin:0;color:#fff;font-family:monospace;font-size:12px;opacity:0.7">This site needs JavaScript enabled.</p></noscript>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
